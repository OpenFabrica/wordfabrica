[package]
name = "wordcraft-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wordcraft-remote.workspace = true
wordcraft-doc.workspace = true
wordcraft-fonts.workspace = true
wordcraft-docx.workspace = true
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror.workspace = true
serde.workspace = true
# Third-party integration: file storage (local / MinIO), signed requests and callbacks.
object_store = { version = "0.14", features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

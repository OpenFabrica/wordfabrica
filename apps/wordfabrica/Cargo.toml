[package]
name = "wordfabrica"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "wordfabrica"
description = "WordFabrica desktop app"

[lints]
workspace = true

[dependencies]
wordfabrica-doc = { workspace = true }
wordfabrica-engine = { workspace = true }
wordfabrica-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for wordfabrica.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

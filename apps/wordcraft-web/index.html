<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="css" href="style/chrome.css" />
  <link data-trunk rel="css" href="style/panes.css" />
  <link data-trunk rel="css" href="style/dialogs.css" />
  <link data-trunk rel="css" href="style/file.css" />
</head>
<body>
  <!-- The HTML chrome (crates/ui-web) mounts into these slots; the document stays an egui canvas.
       `?egui-chrome` hides them and lets egui draw everything, as before. -->
  <div id="wc-app">
    <header id="wc-title"></header>
    <nav id="wc-tabs"></nav>
    <div id="wc-ribbon"></div>
    <div id="wc-main">
      <aside id="wc-left"></aside>
      <main id="wc-doc">
        <canvas id="wordcraft_canvas" tabindex="0" aria-label="Document"></canvas>
      </main>
      <aside id="wc-right"></aside>
    </div>
    <footer id="wc-status"></footer>
  </div>
  <div id="wc-overlay"></div>
  <div id="wordcraft_loading">Loading WordCraft · 正在加载&hellip;</div>
</body>
</html>

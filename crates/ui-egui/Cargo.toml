[package]
name = "wordfabrica-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordFabrica egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
wordfabrica-geom = { workspace = true }
wordfabrica-doc = { workspace = true }
wordfabrica-fonts = { workspace = true }
wordfabrica-layout = { workspace = true }
wordfabrica-render = { workspace = true }
wordfabrica-engine = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The system's preferred interface languages (#8). Native: OS APIs; wasm: none (English).
sys-locale = "0.3"

# The browser's time zone, for local comment times.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

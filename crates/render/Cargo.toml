[package]
name = "wordfabrica-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordFabrica rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
wordfabrica-geom = { workspace = true }
wordfabrica-doc = { workspace = true }
wordfabrica-fonts = { workspace = true }
wordfabrica-layout = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

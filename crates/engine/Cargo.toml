[package]
name = "wordfabrica-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordFabrica engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
wordfabrica-geom = { workspace = true }
wordfabrica-doc = { workspace = true }
wordfabrica-fonts = { workspace = true }
wordfabrica-layout = { workspace = true }
wordfabrica-render = { workspace = true }
wordfabrica-proof = { workspace = true }
wordfabrica-docx = { workspace = true }
wordfabrica-pdf = { workspace = true }
wordfabrica-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
image = { workspace = true }
# Wall-clock time that also works in the browser (std::time panics on wasm32).
web-time = "1.1"
